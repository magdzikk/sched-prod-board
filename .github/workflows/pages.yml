name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The build is the last commit that touched app/, so committing a recording does not change the sha it shows.
      - name: Stamp the build sha
        run: |
          sha=$(git log -1 --format=%H -- app)
          sed -i "s/__BUILD_SHA__/$sha/g" app/index.html
          mkdir -p site && cp -R app/. site/
          if [ -d media ]; then cp -R media site/media; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
